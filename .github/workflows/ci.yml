name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 타입·테스트·빌드 검증
        run: pnpm check
      - name: npm 패키지 생성·설치 검증
        run: node scripts/check-package.mjs
