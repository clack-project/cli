name: npm 배포

# v0.1.0 형태의 태그를 push하면 검증 후 npm 신뢰 게시(OIDC)로 공개한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 준비
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm 신뢰 게시에 필요한 npm 11 준비(11.5.1 이상)
        run: npm i -g npm@11
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 태그·패키지 버전 일치 검사
        if: github.ref_type == 'tag'
        run: node scripts/verify-release-tag.mjs
      - name: 타입·테스트·빌드 검증
        run: pnpm check
      - name: npm 패키지 생성·설치 검증
        run: node scripts/check-package.mjs
      - name: 이미 공개된 버전인지 확인
        id: published
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@clack-platform/cli@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${VERSION}은 이미 npm에 공개되어 있어 게시를 건너뜁니다."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: npm 공개 배포(신뢰 게시)
        if: github.ref_type == 'tag' && steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public
